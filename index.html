<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valuation B3 - VERSÃO DEBUG</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; }
        #debug { background: #f0f8ff; border: 2px solid #007bff; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        #debug h2 { color: #007bff; }
        #debug p { margin: 10px 0; }
        #debug pre { background: #fff; padding: 10px; border: 1px solid #ddd; max-height: 300px; overflow-y: auto; }
        #test-response { margin-top: 10px; background: #e8f5e8; padding: 10px; border-radius: 4px; }
        #app { display: flex; gap: 10px; margin-bottom: 20px; }
        input { padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #218838; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: #f8f9fa; }
        .carregando { color: orange; font-style: italic; }
        .erro { color: red; }
        .preco { font-weight: bold; color: green; }
        #tabela tbody tr:nth-child(even) { background: #f8f9fa; }
    </style>
</head>
<body>
    <!-- SEÇÃO DEBUG -->
    <div id="debug">
        <h2>🔍 DEBUG INFO (Última Requisição)</h2>
        <p><strong>URL exata:</strong> <span id="debug-url">-</span></p>
        <p><strong>Status:</strong> <span id="debug-status">-</span></p>
        <p><strong>JSON completo:</strong></p>
        <pre id="debug-json">-</pre>
        <p><strong>Erro:</strong> <span id="debug-error">-</span></p>
        <button id="btn-teste-api">🧪 Teste API BBSE3</button>
        <div id="test-response">Clique no botão para testar.</div>
    </div>

    <!-- APLICAÇÃO PRINCIPAL -->
    <h1>Valuation B3</h1>
    <div id="inputs">
        <input id="ticker-input" placeholder="Ticker (ex: BBSE3)" maxlength="10">
        <input id="preco-teto-input" type="number" step="0.01" placeholder="Preço Teto" min="0">
        <button id="btn-adicionar">➕ Adicionar</button>
    </div>
    <table id="tabela">
        <thead>
            <tr>
                <th>Ticker</th>
                <th>Preço Atual</th>
                <th>Preço Teto</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <p><em>Auto-update a cada 15 minutos. Dados de <a href="https://brapi.dev" target="_blank">brapi.dev</a>.</em></p>

    <script>
        const TOKEN = 'n26fz9g1XjjNzzrFJrcqf6';
        let portfolio = [];

        // Carregar do LocalStorage
        function carregarPortfolio() {
            const salvo = localStorage.getItem('valuationB3Portfolio');
            portfolio = salvo ? JSON.parse(salvo) : [];
            renderizarTabela();
        }

        // Salvar no LocalStorage
        function salvarPortfolio() {
            localStorage.setItem('valuationB3Portfolio', JSON.stringify(portfolio));
        }

        // Renderizar tabela
        function renderizarTabela() {
            const tbody = document.querySelector('#tabela tbody');
            tbody.innerHTML = '';
            portfolio.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.ticker}</td>
                    <td id="preco-${item.ticker}" class="carregando">Carregando...</td>
                    <td>${parseFloat(item.precoTeto).toFixed(2)}</td>
                    <td id="status-${item.ticker}">-</td>
                    <td><button onclick="removerTicker('${item.ticker}')">❌ Remover</button></td>
                `;
                tbody.appendChild(tr);
                // Buscar preço imediatamente
                buscarPreco(item.ticker);
            });
        }

        // Buscar preço (com DEBUG)
        function buscarPreco(ticker) {
            const url = `https://brapi.dev/api/quote/${ticker}?token=${TOKEN}`;
            console.log('🚀 ANTES da requisição:', { ticker, url });

            // Atualizar DEBUG
            document.getElementById('debug-url').textContent = url;
            document.getElementById('debug-status').textContent = 'Enviando...';
            document.getElementById('debug-json').textContent = '';
            document.getElementById('debug-error').textContent = '';

            const startTime = Date.now();
            fetch(url)
                .then(async (response) => {
                    const tempo = Date.now() - startTime;
                    console.log('📥 RESPOSTA recebida:', { ticker, status: response.status, tempo });
                    document.getElementById('debug-status').textContent = `${response.status} (${tempo}ms)`;

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('✅ JSON completo:', { ticker, data });
                    document.getElementById('debug-json').textContent = JSON.stringify(data, null, 2);

                    const result = data.results?.[0];
                    const preco = result?.regularMarketPrice || 'N/D';
                    atualizarLinha(ticker, preco, 'OK');
                })
                .catch(erro => {
                    console.error('❌ ERRO COMPLETO:', { ticker, erro: erro.message, stack: erro.stack });
                    document.getElementById('debug-error').textContent = erro.message;
                    atualizarLinha(ticker, 'Erro', erro.message);
                });
        }

        // Atualizar linha da tabela
        function atualizarLinha(ticker, preco, status) {
            const elPreco = document.getElementById(`preco-${ticker}`);
            const elStatus = document.getElementById(`status-${ticker}`);
            if (elPreco) {
                elPreco.textContent = typeof preco === 'number' ? preco.toFixed(2) : preco;
                elPreco.className = preco === 'Erro' ? 'erro' : (preco === 'Carregando...' ? 'carregando' : 'preco');
            }
            if (elStatus) elStatus.textContent = status;
        }

        // Adicionar ticker
        document.getElementById('btn-adicionar').onclick = () => {
            const ticker = document.getElementById('ticker-input').value.toUpperCase().trim();
            const precoTeto = parseFloat(document.getElementById('preco-teto-input').value);
            if (!ticker || isNaN(precoTeto) || precoTeto <= 0) {
                alert('Informe ticker válido e preço teto > 0');
                return;
            }
            if (portfolio.find(p => p.ticker === ticker)) {
                alert('Ticker já adicionado');
                return;
            }
            portfolio.push({ ticker, precoTeto });
            salvarPortfolio();
            renderizarTabela();
            document.getElementById('ticker-input').value = '';
            document.getElementById('preco-teto-input').value = '';
        };

        // Remover ticker
        window.removerTicker = function(ticker) {
            portfolio = portfolio.filter(p => p.ticker !== ticker);
            salvarPortfolio();
            renderizarTabela();
        };

        // Botão Teste API
        document.getElementById('btn-teste-api').onclick = async () => {
            const url = `https://brapi.dev/api/quote/BBSE3?token=${TOKEN}`;
            const startTime = Date.now();
            const divTeste = document.getElementById('test-response');
            divTeste.innerHTML = '<strong>Testando...</strong>';

            try {
                const response = await fetch(url);
                const tempo = Date.now() - startTime;
                const data = await response.json();
                divTeste.innerHTML = `
                    <p><strong>Tempo:</strong> ${tempo}ms</p>
                    <p><strong>Status:</strong> ${response.status}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (erro) {
                const tempo = Date.now() - startTime;
                divTeste.innerHTML = `
                    <p><strong>Tempo:</strong> ${tempo}ms</p>
                    <p><strong>Erro:</strong> ${erro.message}</p>
                `;
            }
        };

        // Auto-update a cada 15min
        setInterval(() => {
            console.log('🔄 Auto-update: buscando preços...');
            portfolio.forEach(item => buscarPreco(item.ticker));
        }, 15 * 60 * 1000);

        // Inicializar
        carregarPortfolio();
    </script>
</body>
</html>
