name: Publicar Generoso Lab

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 13-22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-github-pages
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Atualizar cotações
        run: npm run update:market
        env:
          BRAPI_API_TOKEN: ${{ secrets.BRAPI_API_TOKEN }}

      - name: Montar o site para o GitHub Pages
        run: npm run build:pages

      - name: Atualizar os arquivos públicos
        run: npm run sync:pages

      - name: Registrar a atualização
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll 404.html index.html assets favicon.svg og-generoso-lab.png market.json metodologia privacidade termos public/market.json
          if git diff --cached --quiet; then
            echo "Nenhuma atualização necessária."
            exit 0
          fi
          git commit -m "chore: update market snapshot [skip ci]"
          git push
